# Standalone scripts and examples; this repository is not a Python package.
# The primary probe test command uses Python's standard-library unittest.
[tool.pytest.ini_options]
testpaths = ["tests/ha_lab"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--tb=short"]
